services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copiez .env.example vers .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - clinic_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinic_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./clinic-api
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinic_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copiez .env.example vers .env}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copiez .env.example vers .env}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-8081}:8081"
    networks:
      - clinic_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  frontend:
    build:
      context: ./clinic-frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ANGULAR_PORT:-80}:80"
    networks:
      - clinic_network
  frontend-react:
    build:
      context: ./clinique-medicale-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    container_name: clinic_frontend_react
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${REACT_PORT:-81}:80"
    networks:
      - clinic_network

networks:
  clinic_network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
